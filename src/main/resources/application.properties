# Conexión a la base del docker-compose.yml
spring.datasource.url=jdbc:postgresql://localhost:5432/eif509
spring.datasource.username=dev
spring.datasource.password=dev

# validate: Hibernate NO crea tablas — valida que las entidades coincidan
# con el esquema que Flyway ya construyó (V1..V4).
spring.jpa.hibernate.ddl-auto=validate

# Ver cada SQL que Hibernate envía a la base.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# El protagonista de hoy: el gestor de transacciones cuenta en el log
# cuándo abre, suspende, confirma (commit) o deshace (rollback) cada
# transacción, con el nombre del método de servicio.
logging.level.org.springframework.orm.jpa.JpaTransactionManager=DEBUG

# La demo corre por consola y termina; no levanta servidor web.
spring.main.web-application-type=none
